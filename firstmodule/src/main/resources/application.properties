spring.application.name=firstmodule

# database connection
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/firstmodule}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# jpa
spring.jpa.hibernate.ddl-auto=update

# worker crypto keys (configure via environment variables WORKER_CRYPTO_PRIVATE_KEY / WORKER_CRYPTO_PUBLIC_KEY)
worker.crypto.private-key=${WORKER_CRYPTO_PRIVATE_KEY:}
worker.crypto.public-key=${WORKER_CRYPTO_PUBLIC_KEY:}